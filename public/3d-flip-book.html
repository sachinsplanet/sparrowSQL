      highlightActiveTocItem();

      // Notify parent SparrowSQL application of spread change
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'sparrowsql:book-spread',
          spread: currentSpread,
          totalSpreads: TOTAL_SHEETS
        }, '*');
      }
    }

    function goToSpread(targetSpread) {
      const clamped = Math.max(0, Math.min(TOTAL_SHEETS, targetSpread));
      if (clamped === currentSpread) return;

      const prevSpread = currentSpread;
      const diff = Math.abs(clamped - prevSpread);
      currentSpread = clamped;
      syncBookFrameAndUI();

      // Play appropriate realistic book acoustics
      if (diff === 1) {
        playBookAcousticForTransition(prevSpread, clamped);
      } else {
        playRiffleCascade(Math.min(diff, 7));
      }

      // Animate sheets smoothly with staggered cascade if jumping multiple chapters
      for (let i = 0; i < TOTAL_SHEETS; i++) {
        const shouldBeFlipped = i < clamped;
        const targetAngle = shouldBeFlipped ? -180 : 0;
        if (Math.abs(sheetAngles[i] - targetAngle) > 0.5) {
          const staggerOrder = clamped > prevSpread
            ? Math.max(0, i - prevSpread)
            : Math.max(0, prevSpread - 1 - i);
          const delay = Math.min(staggerOrder * 55, 320);
          setTimeout(() => {
            animateSheetToAngle(i, targetAngle, diff === 1 ? 780 : 620);
          }, delay);
        }
      }
    }

    function goToBookPage(pageNumber) {
      const targetSpread = Math.ceil(pageNumber / 2);
      goToSpread(targetSpread);
    }

    window.goToSpread = goToSpread;
    window.goToBookPage = goToBookPage;

    /********************************************************************
     * 4. HYPER-REALISTIC MULTI-STAGE PAPER & HARDCOVER SOUND ENGINE
     *    (Web Audio API — 100% Procedural Physical Book Acoustics)
     ********************************************************************/
    let audioCtx = null;
    let lastHoverRustleTime = 0;

    function ensureAudioContext() {
      if (!soundEnabled || soundVolume <= 0.01) return null;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    function playBookAcousticForTransition(fromSpread, toSpread) {
      // Opening or closing heavy hardcover board (Spread 0 or Spread 16)
      if (fromSpread === 0 || toSpread === 0 || fromSpread === TOTAL_SHEETS || toSpread === TOTAL_SHEETS) {
        playHardcoverThump();
      } else {
        playRealisticPageTurnSound();
      }
    }

    // 3-Stage Realistic Paper Page Turn:
    // (1) Fingertip edge pick friction -> (2) Crisp arching paper air swoosh -> (3) Soft paper stack settle slide & micro-thud
    function playRealisticPageTurnSound(pitchVariance = 1.0) {
      const ctx = ensureAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;
      const masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(soundVolume * 0.65, now);
      masterGain.connect(ctx.destination);

      // --- LAYER 1: Fingertip Paper Edge Pick (0.00s - 0.065s) ---
      const pickLen = Math.floor(ctx.sampleRate * 0.065);
      const pickBuf = ctx.createBuffer(1, pickLen, ctx.sampleRate);
      const pickData = pickBuf.getChannelData(0);
      for (let i = 0; i < pickLen; i++) {
        const t = i / pickLen;
        const env = Math.sin(t * Math.PI) * Math.pow(1 - t, 1.4);
        // Textured crackle + pink-ish grain
        pickData[i] = (Math.random() * 2 - 1) * env * (0.6 + 0.4 * Math.sin(i * 0.15));
      }
      const pickSrc = ctx.createBufferSource();
      pickSrc.buffer = pickBuf;
      const pickFilter = ctx.createBiquadFilter();
      pickFilter.type = 'bandpass';
      pickFilter.frequency.setValueAtTime(2600 * pitchVariance, now);
      pickFilter.Q.value = 2.2;
      const pickGain = ctx.createGain();
      pickGain.gain.setValueAtTime(0.32, now);
      pickSrc.connect(pickFilter);
      pickFilter.connect(pickGain);
      pickGain.connect(masterGain);
      pickSrc.start(now);

      // --- LAYER 2: Main Paper Arch Bend & Air Flutter Wave (0.03s - 0.46s) ---
      const turnDur = 0.44;
      const turnLen = Math.floor(ctx.sampleRate * turnDur);
      const turnBuf = ctx.createBuffer(1, turnLen, ctx.sampleRate);
      const turnData = turnBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < turnLen; i++) {
        const t = i / turnLen;
        const white = Math.random() * 2 - 1;
        // Pink noise filtering for natural fibrous paper timbre
        b0 = 0.997 * b0 + white * 0.029;
        b1 = 0.985 * b1 + white * 0.032;
        b2 = 0.950 * b2 + white * 0.048;
        const pink = (b0 + b1 + b2 + white * 0.18) * 1.6;
        // Organic dual-hump envelope as page lifts and sweeps over spine
        const env = Math.pow(Math.sin(t * Math.PI), 1.15) * (0.82 + 0.18 * Math.sin(t * Math.PI * 3));
        turnData[i] = pink * env;
      }
      const turnSrc = ctx.createBufferSource();
      turnSrc.buffer = turnBuf;

      // Formant Filter A: Paper surface rustle sweep
      const filterA = ctx.createBiquadFilter();
      filterA.type = 'bandpass';
      filterA.frequency.setValueAtTime(820 * pitchVariance, now + 0.03);
      filterA.frequency.exponentialRampToValueAtTime(2150 * pitchVariance, now + 0.21);
      filterA.frequency.exponentialRampToValueAtTime(680 * pitchVariance, now + 0.46);
      filterA.Q.value = 1.65;

      // Formant Filter B: Crisp paper edge shimmer
      const filterB = ctx.createBiquadFilter();
      filterB.type = 'highpass';
      filterB.frequency.setValueAtTime(1450 * pitchVariance, now + 0.03);

      const turnGain = ctx.createGain();
      turnGain.gain.setValueAtTime(0.001, now + 0.02);
      turnGain.gain.linearRampToValueAtTime(0.68, now + 0.18);
      turnGain.gain.exponentialRampToValueAtTime(0.008, now + 0.46);

      turnSrc.connect(filterA);
      filterA.connect(filterB);
      filterB.connect(turnGain);
      turnGain.connect(masterGain);
      turnSrc.start(now + 0.025);

      // --- LAYER 3: Soft Paper-on-Paper Settle Slide & Micro-Thud (0.38s - 0.56s) ---
      const thudOsc = ctx.createOscillator();
      const thudGain = ctx.createGain();
      thudOsc.type = 'sine';
      thudOsc.frequency.setValueAtTime(145 * pitchVariance, now + 0.39);
      thudOsc.frequency.exponentialRampToValueAtTime(46, now + 0.52);

      thudGain.gain.setValueAtTime(0.001, now + 0.38);
      thudGain.gain.linearRampToValueAtTime(0.22, now + 0.41);
      thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.54);

      thudOsc.connect(thudGain);
      thudGain.connect(masterGain);
      thudOsc.start(now + 0.38);
      thudOsc.stop(now + 0.55);
    }

    // Deep Hardcover Open / Close Thump & Spine Creak
    function playHardcoverThump() {
      const ctx = ensureAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;
      const masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(soundVolume * 0.75, now);
      masterGain.connect(ctx.destination);

      // Heavy board air displacement & page swoosh
      playRealisticPageTurnSound(0.78);

      // Resonant low-frequency hardcover board thud
      const osc = ctx.createOscillator();
      const oscGain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(118, now + 0.34);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.58);

      const lowpass = ctx.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.setValueAtTime(190, now + 0.34);

      oscGain.gain.setValueAtTime(0.001, now + 0.33);
      oscGain.gain.linearRampToValueAtTime(0.46, now + 0.37);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.60);

      osc.connect(lowpass);
      lowpass.connect(oscGain);
      oscGain.connect(masterGain);
      osc.start(now + 0.33);
      osc.stop(now + 0.62);
    }

    // Quiet Corner Lift Rustle when hovering or starting a drag
    function playCornerHoverRustle() {
      const nowMs = performance.now();
      if (nowMs - lastHoverRustleTime < 260) return;
      lastHoverRustleTime = nowMs;

      const ctx = ensureAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;
      const dur = 0.09;
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        data[i] = (Math.random() * 2 - 1) * Math.sin(t * Math.PI) * 0.22;
      }

      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1950, now);
      filter.Q.value = 2.0;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(soundVolume * 0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(now);
    }

    // Multi-Page Riffle Cascade when jumping across chapters
    function playRiffleCascade(count) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          playRealisticPageTurnSound(0.92 + i * 0.04);
        }, i * 65);
      }
    }

    /********************************************************************
     * 5. STRICT "BOOK-ONLY" FULLSCREEN MODE & RESPONSIVE SCALING
     ********************************************************************/
    function adjustResponsiveBookScale() {
      const scaler = document.getElementById('bookScaler');
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      if (isBookOnlyFullscreen) {
        // In Book-Only Fullscreen, scale the 3D book to fill ~93% of the entire screen
        const fullTargetW = 940 + 48;
        const fullTargetH = 650 + 55;
        let fullScale = Math.min(vw / fullTargetW, vh / fullTargetH);
        if (isZoomed) fullScale *= 1.15;
        scaler.style.transform = `scale(${fullScale.toFixed(3)})`;
        return;
      }

      const baseWidth = 940 + 115;
      const baseHeight = 650 + 150;

      let scale = Math.min(vw / baseWidth, vh / baseHeight, 1.08);
      if (isZoomed) {
        scale *= 1.24;
      }
      scaler.style.transform = `scale(${scale.toFixed(3)})`;
    }

    function setBookOnlyFullscreen(enable) {
      isBookOnlyFullscreen = enable;
      document.body.classList.toggle('fullscreen-book-only', enable);

      // Notify parent container so the iframe expands to full viewport
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'sparrowsql:book-fullscreen',
          fullscreen: enable
        }, '*');
      }

      // Close any open drawers/modals so ONLY the book is visible
      if (enable) {
        toggleTocDrawer(false);
        const sqlModal = document.getElementById('sqlModal');
        sqlModal.classList.add('hidden');
        sqlModal.classList.remove('flex');

        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {
            // Even if iframe blocks native fullscreen, body.fullscreen-book-only hides all UI
          });
        }
      } else {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }

      setTimeout(adjustResponsiveBookScale, 50);
      adjustResponsiveBookScale();
    }

    function toggleBookOnlyFullscreen() {
      setBookOnlyFullscreen(!isBookOnlyFullscreen);
    }

    // Sync if user exits native browser fullscreen with Escape key
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && isBookOnlyFullscreen) {
        isBookOnlyFullscreen = false;
        document.body.classList.remove('fullscreen-book-only');
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'sparrowsql:book-fullscreen',
            fullscreen: false
          }, '*');
        }
        adjustResponsiveBookScale();
      }
    });

    window.addEventListener('resize', adjustResponsiveBookScale);

    function highlightActiveTocItem() {

        if (sp === currentSpread) {

    async function initSqlPlayground() {
      try {
        if (window.initSqlJs) {
          SQLModule = await window.initSqlJs({
            locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
          });
          resetSqlDatabase();
        }
      } catch (err) {
        console.warn('SQL.js WASM fallback notice:', err);
      }
    }

    function resetSqlDatabase() {
      if (!SQLModule) return;
      if (sqliteDb) sqliteDb.close();
      sqliteDb = new SQLModule.Database();
      sqliteDb.run(SEED_SQL_SCRIPT);
    }

    function runSqlInPlayground(sqlText) {
      const outputEl = document.getElementById('sqlOutputContainer');
      const statusBadge = document.getElementById('sqlStatusBadge');

      if (!sqliteDb) {
        outputEl.innerHTML = `<div class="text-amber-300">Initializing SQLite engine... Please click Run again in a moment.</div>`;
        initSqlPlayground();
        return;
      }

      try {
        const startTime = performance.now();
        const results = sqliteDb.exec(sqlText);
        const elapsed = (performance.now() - startTime).toFixed(1);

        statusBadge.textContent = `Executed in ${elapsed} ms`;
        statusBadge.className = 'text-[11px] text-emerald-400 font-medium';

        if (!results || results.length === 0) {
          outputEl.innerHTML = `
            <div class="p-4 rounded-xl bg-emerald-950/40 border border-emerald-500/30 text-emerald-200">
              <div class="font-bold mb-1">✓ Statement executed successfully.</div>
              <div class="text-xs text-emerald-300/80">No result rows returned (DDL / DML statement completed). Run a <code>SELECT</code> query to inspect the updated table.</div>
            </div>
          `;
          return;
        }

        outputEl.innerHTML = results.map((res, idx) => {
          const cols = res.columns.map(c => `<th class="px-3 py-2 bg-slate-900 text-left font-bold text-blue-300 border-b border-slate-700">${c}</th>`).join('');
          const rows = res.values.map(row => `
            <tr class="border-b border-slate-800/80 hover:bg-slate-900/60">
              ${row.map(val => `<td class="px-3 py-1.5 font-mono text-slate-200">${val === null ? '<span class="text-amber-400 italic">NULL</span>' : val}</td>`).join('')}
            </tr>
          `).join('');

          return `
            <div class="mb-4 last:mb-0">
              <div class="text-[11px] text-slate-400 mb-1.5 font-mono">${res.values.length} row(s) returned</div>
              <div class="overflow-x-auto rounded-lg border border-slate-800">
                <table class="w-full border-collapse text-xs">
                  <thead><tr>${cols}</tr></thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        statusBadge.textContent = 'SQL Error';
        statusBadge.className = 'text-[11px] text-rose-400 font-semibold';
        outputEl.innerHTML = `
          <div class="p-4 rounded-xl bg-rose-950/50 border border-rose-500/40 text-rose-200 font-mono text-xs">
            <div class="font-bold text-rose-300 mb-1">SQL Execution Note / Dialect Check:</div>
            <div>${err.message}</div>
          </div>
        `;
      }
    }

    function openSqlPlayground(prefillSql) {

      if (prefillSql) {

    function showToast(msg) {
      const toast = document.getElementById('toastNotice');
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => {

    function copyTextToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Copied SQL query to clipboard!');
      } catch (e) {
        showToast('Could not copy text');
      }
      document.body.removeChild(textarea);
    }

    /********************************************************************
     * 9. STUDIO AMBIENT BOKEH PARTICLES (MATCHING 3DBOOK BACKDROP)
     ********************************************************************/
    function initBokehParticles() {
      const canvas = document.getElementById('bokehCanvas');
      const ctx = canvas.getContext('2d');
      let w = (canvas.width = window.innerWidth);
      let h = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 38 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2.4 + 0.8,
        vx: (Math.random() - 0.5) * 0.18,
        vy: (Math.random() - 0.5) * 0.15,
        alpha: Math.random() * 0.55 + 0.15,
        warm: Math.random() > 0.35
      }));

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.warm
            ? `rgba(251, 191, 36, ${p.alpha})`
            : `rgba(96, 165, 250, ${p.alpha})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      draw();
    }

    /********************************************************************
     * 10. EVENT LISTENERS (CONTROLS, KEYBOARD, TOUCH SWIPE, PARENT BRIDGE)
     ********************************************************************/
    window.addEventListener('message', (e) => {
      const data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'sparrowsql:goto-page' && typeof data.page === 'number') {
        goToBookPage(data.page);
      } else if (data.type === 'sparrowsql:goto-spread' && typeof data.spread === 'number') {
        goToSpread(data.spread);
      } else if (data.type === 'sparrowsql:set-fullscreen' && typeof data.fullscreen === 'boolean') {
        setBookOnlyFullscreen(data.fullscreen);
      }
    });

    window.onload = function () {
      buildBookSheets();
      populateTocDrawer();
      adjustResponsiveBookScale();
      initBokehParticles();
      initSqlPlayground();

      // Navigation buttons
      document.getElementById('sidePrevBtn')?.addEventListener('click', () => goToSpread(currentSpread - 1));
      document.getElementById('sideNextBtn')?.addEventListener('click', () => goToSpread(currentSpread + 1));
      document.getElementById('bottomPrevBtn')?.addEventListener('click', () => goToSpread(currentSpread - 1));
      document.getElementById('bottomNextBtn')?.addEventListener('click', () => goToSpread(currentSpread + 1));
      document.getElementById('resetCoverBtn')?.addEventListener('click', () => goToSpread(0));

      // Spread slider
      document.getElementById('spreadSlider')?.addEventListener('input', (e) => {
        goToSpread(parseInt(e.target.value, 10));
      });

      // Auto-flip playback
      document.getElementById('autoFlipBtn')?.addEventListener('click', () => {
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        if (autoFlipTimer) {
          clearInterval(autoFlipTimer);
          autoFlipTimer = null;
          playIcon?.classList.remove('hidden');
          pauseIcon?.classList.add('hidden');
        } else {
          playIcon?.classList.add('hidden');
          pauseIcon?.classList.remove('hidden');
          autoFlipTimer = setInterval(() => {
            if (currentSpread < TOTAL_SHEETS) {
              goToSpread(currentSpread + 1);
            } else {
              goToSpread(0);
            }
          }, 3400);
        }
      });

      // Sound & Volume
      document.getElementById('soundToggleBtn')?.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('soundOnIcon')?.classList.toggle('hidden', !soundEnabled);
        document.getElementById('soundOffIcon')?.classList.toggle('hidden', soundEnabled);
        showToast(soundEnabled ? 'Page turn sound ON' : 'Page turn sound MUTED');
      });

      document.getElementById('volumeSlider')?.addEventListener('input', (e) => {
        soundVolume = parseInt(e.target.value, 10) / 100;
      });

      // Zoom toggle (if present)
      const zoomToggleBtn = document.getElementById('zoomToggleBtn');
      if (zoomToggleBtn) {
        zoomToggleBtn.addEventListener('click', () => {
          isZoomed = !isZoomed;
          adjustResponsiveBookScale();
          showToast(isZoomed ? 'Reading Zoom: 125%' : 'Reading Zoom: Standard');
        });
      }

      // Strict Book-Only Fullscreen toggle
      document.getElementById('fullscreenBtn')?.addEventListener('click', () => {
        toggleBookOnlyFullscreen();
      });

      // Double-click dark studio background outside book to exit Book-Only Fullscreen
      document.getElementById('bookViewport')?.addEventListener('dblclick', (e) => {
        if (isBookOnlyFullscreen && !e.target.closest('.book-scene')) {
          setBookOnlyFullscreen(false);
        }
      });

      // Subtle 3D Camera Parallax as mouse moves across studio
      window.addEventListener('mousemove', (e) => {
        const rig = document.getElementById('bookParallaxRig');
        if (!rig) return;
        const nx = (e.clientX / window.innerWidth - 0.5) * 2;
        const ny = (e.clientY / window.innerHeight - 0.5) * 2;
        const tiltY = (nx * 3.2).toFixed(2);
        const tiltX = (-ny * 2.4).toFixed(2);
        rig.style.transform = `rotateY(${tiltY}deg) rotateX(${tiltX}deg)`;
      });

      // Mouse wheel page turning in Fullscreen or over book
      let wheelCooldown = false;
      window.addEventListener('wheel', (e) => {
        const sqlModalOpen = !document.getElementById('sqlModal').classList.contains('hidden');
        const tocOpen = !document.getElementById('tocDrawer').classList.contains('translate-x-full');
        if (sqlModalOpen || tocOpen || wheelCooldown) return;
        if (Math.abs(e.deltaY) < 25) return;

        wheelCooldown = true;
        if (e.deltaY > 0) {
          goToSpread(currentSpread + 1);
        } else {
          goToSpread(currentSpread - 1);
        }
        setTimeout(() => { wheelCooldown = false; }, 520);
      }, { passive: true });

      // Bookmark button
      document.getElementById('bookmarkBtn')?.addEventListener('click', () => {
        if (bookmarks.has(currentSpread)) {
          bookmarks.delete(currentSpread);
          showToast('Bookmark removed');
        } else {
          bookmarks.add(currentSpread);
          showToast('Spread bookmarked!');
        }
        renderBookmarks();
        syncBookFrameAndUI();
      });

      // TOC Drawer
      document.getElementById('tocToggleBtn')?.addEventListener('click', () => toggleTocDrawer());
      document.getElementById('closeTocBtn')?.addEventListener('click', () => toggleTocDrawer(false));

      // Live SQL Playground Modal
      document.getElementById('openPlaygroundBtn')?.addEventListener('click', () => openSqlPlayground());
      document.getElementById('closeSqlModalBtn').addEventListener('click', () => {
        document.getElementById('sqlModal').classList.add('hidden');
        document.getElementById('sqlModal').classList.remove('flex');
      });
      document.getElementById('sendToMainLabBtn').addEventListener('click', () => {
        const sqlText = document.getElementById('sqlEditorInput').value;
        document.getElementById('sqlModal').classList.add('hidden');
        document.getElementById('sqlModal').classList.remove('flex');
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'sparrowsql:open-in-lab',
            sql: sqlText
          }, '*');
        }
      });
      document.getElementById('executeSqlBtn').addEventListener('click', () => {
        runSqlInPlayground(document.getElementById('sqlEditorInput').value);
      });
      document.getElementById('copyEditorSqlBtn').addEventListener('click', () => {
        copyTextToClipboard(document.getElementById('sqlEditorInput').value);
      });
      document.getElementById('resetDbBtn').addEventListener('click', () => {
        resetSqlDatabase();
        runSqlInPlayground(document.getElementById('sqlEditorInput').value);
        showToast('Practice database reset to initial state!');
      });

      document.querySelectorAll('.quick-sql-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const q = btn.dataset.quickSql;
          document.getElementById('sqlEditorInput').value = q;
          runSqlInPlayground(q);
        });
      });

      // Delegated clicks for Copy & Run buttons inside book pages
      document.body.addEventListener('click', (e) => {
        const copyBtn = e.target.closest('.copy-sql-btn');
        if (copyBtn) {
          e.stopPropagation();
          copyTextToClipboard(copyBtn.dataset.copySql);
          return;
        }
        const runBtn = e.target.closest('.run-sql-btn');
        if (runBtn) {
          e.stopPropagation();
          if (isBookOnlyFullscreen) setBookOnlyFullscreen(false);
          openSqlPlayground(runBtn.dataset.runSql);
          return;
        }
      });

      // Keyboard Left / Right Arrows, F for Fullscreen, Escape to exit Book-Only Fullscreen
      window.addEventListener('keydown', (e) => {
        const sqlModalOpen = !document.getElementById('sqlModal').classList.contains('hidden');
        if (sqlModalOpen) {
          if (e.key === 'Escape') {
            document.getElementById('sqlModal').classList.add('hidden');
            document.getElementById('sqlModal').classList.remove('flex');
          }
          return;
        }
        if (e.key === 'Escape' && isBookOnlyFullscreen) {
          setBookOnlyFullscreen(false);
          return;
        }
        if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
          toggleBookOnlyFullscreen();
          return;
        }
        if (e.key === 'ArrowRight') goToSpread(currentSpread + 1);
        if (e.key === 'ArrowLeft') goToSpread(currentSpread - 1);
      });

      // Touch swipe support on mobile/tablet
      let touchStartX = null;
      const viewport = document.getElementById('bookViewport');
      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
      }, { passive: true });

      viewport.addEventListener('touchend', (e) => {
        if (touchStartX === null || e.changedTouches.length === 0) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 45) {
          if (dx < 0) goToSpread(currentSpread + 1);
          else goToSpread(currentSpread - 1);
        }
        touchStartX = null;
      }, { passive: true });
    };
  </script>
