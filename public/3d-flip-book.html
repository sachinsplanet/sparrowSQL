<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete SQL — 3D Interactive Book (SQL by sparrowsql)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- SQL.js (SQLite WebAssembly for Live Playground) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

  <style>
    :root {
      --book-width: 470px;
      --book-height: 650px;
      --paper-bg: #fcfaf4;
      --paper-border: #dfd7c6;
      --cover-bg: #fafaf8;
      --brand-blue: #0077ff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #070a12;
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
    }

    /* ============================================================================
       STRICT "BOOK-ONLY" FULLSCREEN MODE
       When active, ONLY AND ONLY the 3D book is visible on the entire screen!
       ============================================================================ */
    body.fullscreen-book-only .ui-chrome,
    body.fullscreen-book-only #topHeaderBar,
    body.fullscreen-book-only #bottomControlBar,
    body.fullscreen-book-only #sidePrevBtn,
    body.fullscreen-book-only #sideNextBtn,
    body.fullscreen-book-only #tocDrawer,
    body.fullscreen-book-only #sqlModal,
    body.fullscreen-book-only #toastNotice {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    body.fullscreen-book-only .book-viewport {
      padding-bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }

    /* Studio Ambient Backdrop & Bokeh */
    .studio-backdrop {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(36, 72, 138, 0.46) 0%, rgba(12, 18, 34, 0.88) 54%, #04060b 100%),
        linear-gradient(180deg, #090e1a 0%, #111827 68%, #06080d 100%);
      z-index: 0;
    }

    /* Desk Reflective Surface */
    .desk-surface {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 25vh;
      background:
        radial-gradient(ellipse 72% 55% at 50% 0%, rgba(251, 191, 36, 0.13) 0%, rgba(56, 189, 248, 0.06) 48%, transparent 82%),
        linear-gradient(180deg, rgba(15, 23, 42, 0.32) 0%, rgba(5, 8, 17, 0.96) 38%, #030509 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.85);
      z-index: 1;
    }

    /* Glassmorphism Controls */
    .glass-pill {
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .glass-btn {
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-btn:hover:not(:disabled) {
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 12px 28px rgba(0, 119, 255, 0.22);
    }
    .glass-btn:active:not(:disabled) {
      transform: translateY(0) scale(0.97);
    }
    .glass-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* 3D Book Stage */
    .book-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2600px;
      z-index: 10;
      padding-bottom: 28px;
      transition: padding 0.4s ease;
    }

    .book-scaler {
      transform-style: preserve-3d;
      transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .book-parallax-rig {
      transform-style: preserve-3d;
      transition: transform 0.18s ease-out;
    }

    .book-scene {
      position: relative;
      width: calc(var(--book-width) * 2);
      height: var(--book-height);
      transform-style: preserve-3d;
      transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Realistic Floor Shadow & Warm Desk Reflection beneath the 3D Book */
    .book-floor-shadow {
      position: absolute;
      bottom: -40px;
      left: 3%;
      right: 3%;
      height: 64px;
      background:
        radial-gradient(ellipse at center, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.62) 48%, transparent 78%),
        radial-gradient(ellipse at 50% 35%, rgba(254, 243, 199, 0.14) 0%, transparent 60%);
      filter: blur(15px);
      transform: rotateX(76deg) translateZ(-28px);
      transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    /* Hardcover Back Board Base */
    .hardcover-base {
      position: absolute;
      top: -9px;
      bottom: -12px;
      left: -15px;
      right: -15px;
      border-radius: 11px;
      background:
        linear-gradient(90deg, #0d121d 0%, #1c2538 46.5%, #070a10 50%, #1c2538 53.5%, #0d121d 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 30px 65px rgba(0, 0, 0, 0.9),
        0 8px 20px rgba(0, 0, 0, 0.75),
        inset 0 1px 2px rgba(255, 255, 255, 0.18),
        inset 0 -3px 6px rgba(0, 0, 0, 0.8);
      transform: translateZ(-20px);
      transition: opacity 0.5s ease, clip-path 0.68s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Center Book Spine Ridge & Head/Tail Cloth Bands */
    .book-spine-hinge {
      position: absolute;
      top: -10px;
      bottom: -13px;
      left: calc(50% - 18px);
      width: 36px;
      background:
        linear-gradient(90deg, #070a11 0%, #25314a 25%, #0d121c 50%, #25314a 75%, #070a11 100%);
      border-radius: 5px;
      transform: translateZ(-17px);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.95), 0 10px 25px rgba(0,0,0,0.7);
      z-index: 1;
      transition: opacity 0.45s ease;
    }
    .book-spine-hinge::before,
    .book-spine-hinge::after {
      content: "";
      position: absolute;
      left: 4px;
      right: 4px;
      height: 6px;
      background: repeating-linear-gradient(90deg, #d97706 0px, #fbbf24 3px, #1e40af 3px, #3b82f6 6px);
      border-radius: 2px;
      opacity: 0.85;
    }
    .book-spine-hinge::before { top: 2px; }
    .book-spine-hinge::after { bottom: 3px; }

    /* Layered Paper Block Edges (Left & Right stacks) */
    .paper-stack-left,
    .paper-stack-right {
      position: absolute;
      top: 1px;
      bottom: 1px;
      pointer-events: none;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease, transform 0.5s ease;
      z-index: 2;
    }

    .paper-stack-left {
      left: -10px;
      width: 15px;
      border-radius: 4px 0 0 4px;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.18) 0%, transparent 8%, transparent 92%, rgba(0,0,0,0.24) 100%),
        repeating-linear-gradient(
          90deg,
          #dfd6c1 0px,
          #faf6ed 1.2px,
          #cbbda0 2.4px
        );
      box-shadow: -4px 6px 14px rgba(0, 0, 0, 0.55), inset 1px 0 3px rgba(255,255,255,0.5);
      transform-origin: right center;
      transform: rotateY(-12deg);
    }

    .paper-stack-right {
      right: -10px;
      width: 15px;
      border-radius: 0 4px 4px 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.18) 0%, transparent 8%, transparent 92%, rgba(0,0,0,0.24) 100%),
        repeating-linear-gradient(
          90deg,
          #cbbda0 0px,
          #faf6ed 1.2px,
          #dfd6c1 2.4px
        );
      box-shadow: 4px 6px 14px rgba(0, 0, 0, 0.55), inset -1px 0 3px rgba(255,255,255,0.5);
      transform-origin: left center;
      transform: rotateY(12deg);
    }

    /* Bottom Arched Paper Edge Thickness (Gives curved open-book profile like 3dbook photo) */
    .paper-bottom-edge-left,
    .paper-bottom-edge-right {
      position: absolute;
      bottom: -8px;
      height: 10px;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          180deg,
          #f3efe4 0px,
          #cfc5ae 1.3px,
          #faf7f0 2.6px
        );
      box-shadow: 0 6px 12px rgba(0,0,0,0.52);
      transition: all 0.5s ease;
      z-index: 3;
    }
    .paper-bottom-edge-left {
      left: -4px;
      width: calc(50% + 4px);
      border-radius: 0 0 40% 6px / 0 0 8px 4px;
      background-image:
        linear-gradient(90deg, rgba(0,0,0,0.18) 0%, rgba(255,255,255,0.35) 55%, rgba(0,0,0,0.48) 100%),
        repeating-linear-gradient(180deg, #f3efe4 0px, #cfc5ae 1.4px, #faf7f0 2.8px);
    }
    .paper-bottom-edge-right {
      right: -4px;
      width: calc(50% + 4px);
      border-radius: 0 0 6px 40% / 0 0 4px 8px;
      background-image:
        linear-gradient(90deg, rgba(0,0,0,0.48) 0%, rgba(255,255,255,0.35) 45%, rgba(0,0,0,0.18) 100%),
        repeating-linear-gradient(180deg, #f3efe4 0px, #cfc5ae 1.4px, #faf7f0 2.8px);
    }

    /* Dynamic Cast Shadow swept across the open book pages during a flip */
    .book-gutter-ambient-shadow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: linear-gradient(
        90deg,
        transparent 0%,
        transparent 44%,
        rgba(15, 12, 8, 0.08) 47.5%,
        rgba(10, 8, 5, 0.34) 50%,
        rgba(15, 12, 8, 0.08) 52.5%,
        transparent 56%,
        transparent 100%
      );
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .dynamic-cast-shadow {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      left: 0;
      pointer-events: none;
      z-index: 998;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    /* Individual 3D Sheet */
    .sheet {
      position: absolute;
      top: 0;
      right: 0;
      width: var(--book-width);
      height: var(--book-height);
      transform-origin: left center;
      transform-style: preserve-3d;
      cursor: grab;
      will-change: transform;
    }
    .sheet:active {
      cursor: grabbing;
    }

    /* Front & Back Faces of each Sheet */
    .page-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background-color: var(--paper-bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform-style: preserve-3d;
    }

    /* Realistic Fine Paper Grain + Cylindrical Arch Lighting Overlay */
    .page-face::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    /* Right-hand Page (Front of Sheet) — Curved cylindrical arch out of spine */
    .page-front {
      border-radius: 0 8px 8px 0;
      border: 1px solid #dcd3c0;
      border-left: none;
      box-shadow:
        inset 42px 0 58px -18px rgba(24, 18, 10, 0.28),
        inset 8px 0 16px -4px rgba(15, 10, 5, 0.32),
        inset -18px 0 28px -12px rgba(140, 120, 90, 0.12),
        inset -1px 0 0 rgba(255, 255, 255, 0.88);
    }
    .page-front::before {
      background:
        /* Cylindrical spine-to-fore-edge 3D arch lighting */
        linear-gradient(
          90deg,
          rgba(25, 18, 10, 0.22) 0%,
          rgba(40, 30, 18, 0.07) 7%,
          rgba(255, 255, 255, 0.55) 24%,
          rgba(255, 253, 248, 0.15) 62%,
          rgba(165, 148, 120, 0.12) 94%,
          rgba(90, 75, 55, 0.18) 100%
        ),
        radial-gradient(rgba(160, 140, 105, 0.055) 1px, transparent 0);
      background-size: 100% 100%, 14px 14px;
    }

    /* Left-hand Page (Back of Sheet) — Curved cylindrical arch into spine */
    .page-back {
      transform: rotateY(180deg);
      border-radius: 8px 0 0 8px;
      border: 1px solid #dcd3c0;
      border-right: none;
      box-shadow:
        inset -42px 0 58px -18px rgba(24, 18, 10, 0.28),
        inset -8px 0 16px -4px rgba(15, 10, 5, 0.32),
        inset 18px 0 28px -12px rgba(140, 120, 90, 0.12),
        inset 1px 0 0 rgba(255, 255, 255, 0.88);
    }
    .page-back::before {
      background:
        /* Cylindrical fore-edge-to-spine 3D arch lighting */
        linear-gradient(
          270deg,
          rgba(25, 18, 10, 0.22) 0%,
          rgba(40, 30, 18, 0.07) 7%,
          rgba(255, 255, 255, 0.55) 24%,
          rgba(255, 253, 248, 0.15) 62%,
          rgba(165, 148, 120, 0.12) 94%,
          rgba(90, 75, 55, 0.18) 100%
        ),
        radial-gradient(rgba(160, 140, 105, 0.055) 1px, transparent 0);
      background-size: 100% 100%, 14px 14px;
    }

    /* Moving Specular Light & Bend Shadow on the actively turning sheet */
    .page-curl-lighting {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      z-index: 25;
      transition: opacity 0.15s ease;
    }

    /* Interactive 3D Corner Peel Fold Effect */
    .corner-peel-fold {
      position: absolute;
      bottom: 0;
      width: 58px;
      height: 58px;
      pointer-events: none;
      z-index: 30;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      opacity: 0.45;
    }
    .page-front .corner-peel-fold {
      right: 0;
      background: linear-gradient(135deg, transparent 48%, rgba(0,0,0,0.12) 50%, #f5efe2 52%, #e2d8c3 100%);
      border-top-left-radius: 10px;
      box-shadow: -3px -3px 8px rgba(0, 0, 0, 0.12);
      transform-origin: bottom right;
      transform: scale(0.38);
    }
    .page-back .corner-peel-fold {
      left: 0;
      background: linear-gradient(225deg, transparent 48%, rgba(0,0,0,0.12) 50%, #f5efe2 52%, #e2d8c3 100%);
      border-top-right-radius: 10px;
      box-shadow: 3px -3px 8px rgba(0, 0, 0, 0.12);
      transform-origin: bottom left;
      transform: scale(0.38);
    }

    .sheet:not(.flipped):hover .page-front .corner-peel-fold {
      opacity: 1;
      transform: scale(1);
      box-shadow: -8px -8px 18px rgba(0, 0, 0, 0.24);
    }
    .sheet.flipped:hover .page-back .corner-peel-fold {
      opacity: 1;
      transform: scale(1);
      box-shadow: 8px -8px 18px rgba(0, 0, 0, 0.24);
    }

    /* Page Content Styling (Book Typography) */
    .book-page-inner {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      padding: 20px 28px 18px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #1e293b;
      font-size: 11.4px;
      line-height: 1.48;
      user-select: text;
    }

    .page-front .book-page-inner {
      padding-left: 36px;
      padding-right: 26px;
    }
    .page-back .book-page-inner {
      padding-left: 26px;
      padding-right: 36px;
    }

    .running-header {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: #64748b;
      border-bottom: 1px solid #e2dcd0;
      padding-bottom: 5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .running-footer {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
      border-top: 1px solid #e2dcd0;
      padding-top: 6px;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .chapter-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin: 2px 0 6px 0;
      line-height: 1.2;
    }

    .chapter-num {
      color: #0066eb;
      margin-right: 5px;
    }

    .section-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12.2px;
      font-weight: 700;
      color: #1d4ed8;
      margin: 7px 0 3px 0;
      line-height: 1.25;
    }

    .book-prose {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 10.6px;
      line-height: 1.48;
      color: #273244;
      margin-bottom: 5px;
    }

    /* SQL Code Block in Book */
    .sql-block-wrap {
      margin: 5px 0;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #1e293b;
      background: #0b1324;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.14);
    }

    .sql-block-label {
      background: #131f38;
      color: #60a5fa;
      font-family: 'Inter', sans-serif;
      font-size: 8.2px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 3px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .sql-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.7px;
      line-height: 1.4;
      color: #f1f5f9;
      padding: 6px 9px;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .sql-kw { color: #38bdf8; font-weight: 600; }
    .sql-str { color: #fde047; }
    .sql-num { color: #f472b6; }
    .sql-comment { color: #64748b; font-style: italic; }

    /* Book Tables */
    .book-table {
      width: 100%;
      border-collapse: collapse;
      margin: 5px 0;
      font-family: 'Inter', sans-serif;
      font-size: 9.6px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      overflow: hidden;
    }
    .book-table th {
      background: #e9eff8;
      color: #0f172a;
      font-weight: 700;
      text-align: left;
      padding: 4px 6px;
      border-bottom: 1px solid #cbd5e1;
    }
    .book-table td {
      padding: 3.5px 6px;
      border-bottom: 1px solid #e2e8f0;
      color: #1e293b;
      vertical-align: top;
    }
    .book-table tr:last-child td {
      border-bottom: none;
    }

    /* Callout Banner in Book */
    .book-callout {
      margin: 5px 0;
      padding: 5.5px 8px;
      border-left: 3px solid #0077ff;
      background: #eff6ff;
      border-radius: 0 4px 4px 0;
      font-family: 'Inter', sans-serif;
      font-size: 9.6px;
      line-height: 1.38;
      color: #1e3a8a;
    }
    .book-callout.warn {
      border-left-color: #d97706;
      background: #fffbeb;
      color: #78350f;
    }
    .book-callout-tag {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 4px;
    }

    /* Corner Curl Indicator */
    .corner-curl-hint {
      position: absolute;
      bottom: 10px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 119, 255, 0.1);
      color: #0077ff;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 15;
    }
    .page-front .corner-curl-hint { right: 10px; }
    .page-back .corner-curl-hint { left: 10px; }

    /* Custom Range Slider */
    input[type="range"].book-slider {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.18);
      height: 5px;
      border-radius: 999px;
      outline: none;
    }
    input[type="range"].book-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #0077ff;
      box-shadow: 0 0 10px rgba(0, 119, 255, 0.8);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type="range"].book-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Scrollbar inside modals */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 999px;
    }
  </style>
</head>
<body>

  <!-- Ambient Studio Background & Bokeh Canvas -->

        <button data-quick-sql="SELECT c.customer_name, o.product FROM customers AS c LEFT JOIN orders AS o ON c.customer_id = o.customer_id;" class="quick-sql-btn px-2.5 py-1 rounded bg-slate-800 hover:bg-blue-600/30 text-blue-300 border border-white/10 shrink-0">customers + orders</button>

  <script>
    /********************************************************************
     * 1. COMPLETE BOOK DATA — ALL 29 PAGES OF "SQL BY SPARROWSQL"
     *    Plus Front Cover (COMPLETE SQL), Inside Bookplate, and Back Cover
     ********************************************************************/

    // Helper for syntax-highlighted SQL blocks with Copy + Run buttons
    function sqlBlock(label, rawSql) {
      const escapedAttr = rawSql.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const highlighted = rawSql
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/(--.*)/g, '<span class="sql-comment">$1</span>')
        .replace(/('[^']*')/g, '<span class="sql-str">$1</span>')
        .replace(/\b(SELECT|FROM|WHERE|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|DATABASE|IF|NOT|EXISTS|USE|DROP|ALTER|ADD|COLUMN|RENAME|TO|TRUNCATE|PRIMARY|KEY|FOREIGN|REFERENCES|UNIQUE|DEFAULT|CHECK|INTEGER|REAL|TEXT|BLOB|NUMERIC|DECIMAL|DATE|TIME|AS|AND|OR|IN|BETWEEN|LIKE|IS|NULL|DISTINCT|ORDER|BY|ASC|DESC|LIMIT|OFFSET|COUNT|SUM|AVG|MAX|MIN|GROUP|HAVING|INNER|LEFT|RIGHT|FULL|OUTER|CROSS|JOIN|ON|UNION|ALL|INTERSECT|EXCEPT|VIEW|INDEX|BEGIN|START|TRANSACTION|COMMIT|ROLLBACK|SAVEPOINT|PRAGMA|GRANT|REVOKE)\b/g, '<span class="sql-kw">$1</span>');

      return `
        <div class="sql-block-wrap" onclick="event.stopPropagation()">
          <div class="sql-block-label">
            <span>${label}</span>
            <span class="flex items-center gap-1.5">
              <button type="button" data-copy-sql="${escapedAttr}" class="copy-sql-btn px-1.5 py-0.5 rounded bg-white/10 hover:bg-white/20 text-[8px] text-slate-200 transition">Copy</button>
              <button type="button" data-run-sql="${escapedAttr}" class="run-sql-btn px-1.5 py-0.5 rounded bg-blue-600/80 hover:bg-blue-500 text-[8px] text-white transition">▶ Run</button>
            </span>
          </div>
          <pre class="sql-code">${highlighted}</pre>
        </div>
      `;
    }

    // Exact Front Cover recreation matching the user's "COMPLETE SQL" cover image
    const frontCoverHTML = `
      <div class="w-full h-full bg-[#fafaf8] text-[#111827] flex flex-col justify-between px-9 py-8 relative select-none" style="border-radius: 0 7px 7px 0; box-shadow: inset 14px 0 24px -10px rgba(0,0,0,0.22), inset -2px 0 4px rgba(0,0,0,0.08);">

            COMPLETE

          <div class="flex items-center justify-center leading-none select-none my-1">

              <path d="M76 31 C68 21, 55 17, 40 17 C19 17, 6 28, 6 44 C6 61, 20 68, 42 72 C58 75, 65 79, 65 88 C65 98, 54 104, 39 104 C24 104, 14 98, 7 88 L-4 101 C6 114, 21 121, 40 121 C66 121, 84 108, 84 87 C84 68, 69 60, 46 56 C30 53, 25 49, 25 42 C25 35, 32 31, 42 31 C53 31, 61 35, 67 42 Z" transform="translate(12,0)" fill="#181c24"/>

            </svg>

          <p class="text-[13.5px] text-slate-600 font-normal leading-relaxed mt-2 tracking-wide">
            From Basics to Advanced<br/>
            Queries and Real-World Projects

        </div>

        <!-- Center Database + Code Card Illustration -->
        <div class="relative flex items-center justify-center my-2 h-[185px]">
          <!-- Soft Blue Circle Backdrop -->
          <div class="w-32 h-32 rounded-full bg-[#eef5ff] absolute translate-x-6 -translate-y-4"></div>

          <!-- 3D Dark Cylinder Database Stack -->

            <svg viewBox="0 0 130 155" class="w-32 h-auto drop-shadow-md">
              <!-- Top Cap -->
              <ellipse cx="65" cy="24" rx="54" ry="18" fill="#181e29"/>
              <!-- Tier 1 Body -->
              <path d="M11 28 C11 39, 35 46, 65 46 C95 46, 119 39, 119 28 L119 58 C119 69, 95 76, 65 76 C35 76, 11 69, 11 58 Z" fill="#181e29"/>
              <!-- Tier 2 Body -->
              <path d="M11 63 C11 74, 35 81, 65 81 C95 81, 119 74, 119 63 L119 93 C119 104, 95 111, 65 111 C35 111, 11 104, 11 93 Z" fill="#181e29"/>
              <!-- Tier 3 Body -->
              <path d="M11 98 C11 109, 35 116, 65 116 C95 116, 119 109, 119 98 L119 128 C119 139, 95 146, 65 146 C35 146, 11 139, 11 128 Z" fill="#181e29"/>
            </svg>
          </div>

          <!-- Floating White SQL Query Card -->
          <div class="relative z-20 -ml-8 mt-10 bg-white rounded-xl px-4 py-3.5 border border-slate-100 shadow-[0_14px_30px_rgba(0,119,255,0.13)] w-[165px]">
            <div class="flex items-center gap-1.5 mb-2">
              <span class="w-2 h-2 rounded-full bg-[#0077ff]"></span>
              <span class="w-2 h-2 rounded-full bg-[#0077ff]"></span>
              <span class="w-2 h-2 rounded-full bg-[#0077ff]"></span>
            </div>
            <div class="font-mono text-[11.5px] leading-snug text-slate-800">
              <div><span class="text-[#0077ff] font-semibold">SELECT</span> *</div>

              <div><span class="text-[#0077ff] font-semibold">WHERE</span> id = 1;</div>
            </div>
          </div>
        </div>

        <!-- Bottom 4-Column Feature Icons Row -->
        <div class="pt-3 border-t border-slate-200/80 grid grid-cols-4 divide-x divide-slate-200 text-center">
          <!-- Queries -->
          <div class="px-1 flex flex-col items-center">
            <svg class="w-6 h-6 mb-1.5" viewBox="0 0 24 24" fill="none" stroke="#181e29" stroke-width="1.8">

              <rect x="4" y="13" width="3.5" height="6" rx="0.5"/>
              <rect x="10.25" y="9" width="3.5" height="10" rx="0.5"/>
              <rect x="16.5" y="5" width="3.5" height="14" rx="0.5"/>

            <span class="text-[8.5px] font-semibold tracking-[0.14em] text-slate-700">FUNCTIONS</span>
          </div>
          <!-- Joins -->
          <div class="px-1 flex flex-col items-center">
            <svg class="w-6 h-6 mb-1.5" viewBox="0 0 24 24" fill="none" stroke="#181e29" stroke-width="1.7">
              <circle cx="12" cy="12" r="3.2"/>
              <path stroke-linecap="round" d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>
            </svg>
            <span class="text-[8.5px] font-semibold tracking-[0.14em] text-slate-700">JOINS</span>
          </div>
          <!-- Real-World Examples -->
          <div class="px-1 flex flex-col items-center">
            <svg class="w-6 h-6 mb-1.5" viewBox="0 0 24 24" fill="none" stroke="#181e29" stroke-width="1.8">
              <rect x="5" y="3.5" width="14" height="17" rx="2"/>

            <span class="text-[8px] font-semibold tracking-[0.11em] text-slate-700 leading-tight">REAL-WORLD<br/>EXAMPLES</span>

        </div>

    `;

    // Array of all 30 interior pages (Pages 1 to 29 from PDF + Page 30 Colophon/Lab)
    const bookPages = [
      // PAGE 1: Title Page
      {
        pageNumber: 1,
        title: "Title Page — SQL by sparrowsql",
        content: `
          <div class="flex-1 flex flex-col justify-between py-2">
            <div>
              <span class="inline-block px-3 py-1 rounded-full bg-blue-50 border border-blue-200 text-blue-800 font-semibold text-[10px] mb-3">sparrowsql</span>
              <div class="text-[9.5px] font-bold tracking-[0.14em] text-blue-700 uppercase mb-2">SQL BY SPARROWSQL / A PRACTICAL FIELD GUIDE</div>
              <h1 class="text-[28px] font-black text-slate-900 leading-[1.08] tracking-tight mb-3" style="font-family:'Plus Jakarta Sans',sans-serif;">
                SQL<br/>
                <span class="text-[22px] font-extrabold text-slate-800">FROM FIRST QUERY TO REAL PROJECTS</span>
              </h1>
              <p class="book-prose text-[11.5px] text-slate-600">
                A hands-on guide to databases, queries, relationships, and useful data thinking.
              </p>
            </div>

            <div class="my-4 p-4 rounded-xl bg-white/80 border border-slate-200 shadow-sm space-y-2">
              <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Edition</span>
                <span class="text-xs font-bold text-slate-800">SQL BY SPARROWSQL</span>

            <h2 class="chapter-title"><span class="chapter-num">01</span>Databases and SQL</h2>
            <p class="book-prose">
              A database is an organised collection of data. A database management system (DBMS) is the software that stores, retrieves, secures, and manages that data.
            </p>

            <h3 class="section-heading">The main building blocks</h3>
            <ul class="list-disc pl-4 space-y-0.5 text-[10px] text-slate-700 font-serif mb-2">

              <li><strong>Column (field):</strong> one attribute, such as name, email, or price.</li>
              <li><strong>DBMS:</strong> software that manages databases. Examples include SQLite, MySQL, PostgreSQL, and SQL Server.</li>
              <li><strong>RDBMS:</strong> a DBMS that organises data into related tables.</li>

            <h3 class="section-heading">What is SQL?</h3>
            <p class="book-prose">

            </div>

            </p>

            <h3 class="section-heading">Primary keys</h3>
            <p class="book-prose">
              A primary key identifies each row uniquely. It should not be NULL, and a table has one primary-key constraint, though that key may contain multiple columns.

            <h3 class="section-heading">Foreign keys</h3>
            <p class="book-prose">

            </p>

            <h3 class="section-heading">Common constraints</h3>
            <table class="book-table">

                <tr><td><strong>PRIMARY KEY</strong></td><td>Unique row identifier</td><td><code>id INTEGER PRIMARY KEY</code></td></tr>
                <tr><td><strong>FOREIGN KEY</strong></td><td>Enforce a relationship</td><td><code>FOREIGN KEY (team_id) REFERENCES teams(team_id)</code></td></tr>
                <tr><td><strong>DEFAULT</strong></td><td>Supply a value when omitted</td><td><code>active INTEGER DEFAULT 1</code></td></tr>

            <h2 class="chapter-title"><span class="chapter-num">09</span>Sorting and limiting results</h2>
            <p class="book-prose">
              ORDER BY sorts rows. LIMIT caps the number returned in SQLite and several other systems. A row limit is most useful when paired with a meaningful sort.
            </p>

            <h3 class="section-heading">Ascending and descending</h3>
            ${sqlBlock("ORDER BY", `SELECT full_name, marks\nFROM students\nORDER BY marks DESC;`)}
            <p class="book-prose">
              ASC means ascending and is the default. DESC means descending. You may sort by more than one column; the first column is the main sort key, and later columns break ties.
            </p>

            ${sqlBlock("SORT BY MULTIPLE COLUMNS", `SELECT full_name, city, marks\nFROM students\nORDER BY city ASC, marks DESC;`)}

            <h3 class="section-heading">Limit rows</h3>
            ${sqlBlock("LIMIT", `SELECT full_name, marks\nFROM students\nORDER BY marks DESC\nLIMIT 3;`)}
            <p class="book-prose">
              This query returns up to three students with the highest marks. Without ORDER BY, the selected rows are not guaranteed to be the "top" rows.
            </p>

            <h3 class="section-heading">Pagination pattern</h3>
            ${sqlBlock("LIMIT WITH OFFSET", `SELECT product_id, name, price\nFROM products\nORDER BY product_id\nLIMIT 10 OFFSET 0;`)}
            <p class="book-prose">
              OFFSET skips rows before returning the next group. For large changing datasets, keyset pagination can be more stable and efficient than large offsets, but LIMIT/OFFSET is a useful starting point.
            </p>

            <div class="book-callout">
              <span class="book-callout-tag">DIALECT NOTE</span>
              Other databases may use TOP, FETCH FIRST, or LIMIT/OFFSET-like syntax. Check the dialect before copying queries between systems.
            </div>
          </div>
        `
      },

      // PAGE 13: 10 Aggregate functions
      {
        pageNumber: 13,
        title: "10 Aggregate functions",
        content: `
          <div>
            <h2 class="chapter-title"><span class="chapter-num">10</span>Aggregate functions</h2>
            <p class="book-prose">
              Aggregate functions calculate one summary value from several rows. They are used for totals, counts, averages, and extremes.
            </p>

            <table class="book-table">
              <thead><tr><th>Function</th><th>What it returns</th><th>Example</th></tr></thead>
              <tbody>
                <tr><td><code>COUNT(*)</code></td><td>Number of rows</td><td><code>COUNT(*)</code></td></tr>
                <tr><td><code>COUNT(column)</code></td><td>Number of non-NULL values in a column</td><td><code>COUNT(city)</code></td></tr>
                <tr><td><code>SUM(column)</code></td><td>Total of numeric values</td><td><code>SUM(amount)</code></td></tr>
                <tr><td><code>AVG(column)</code></td><td>Average of numeric values</td><td><code>AVG(marks)</code></td></tr>
                <tr><td><code>MAX(column)</code></td><td>Largest value</td><td><code>MAX(price)</code></td></tr>
                <tr><td><code>MIN(column)</code></td><td>Smallest value</td><td><code>MIN(price)</code></td></tr>
              </tbody>
            </table>

            <h3 class="section-heading">Summary of a whole table</h3>
            ${sqlBlock("AGGREGATE QUERY", `SELECT\n  COUNT(*) AS student_count,\n  ROUND(AVG(marks), 2) AS average_marks,\n  MAX(marks) AS highest_marks,\n  MIN(marks) AS lowest_marks\nFROM students;`)}

            <p class="book-prose">
              An aggregate query without GROUP BY usually returns one summary row for the selected set. <code>COUNT(*)</code> counts rows. <code>COUNT(column)</code> skips rows where that column is NULL. Most aggregate functions ignore NULL inputs.
            </p>

            <h3 class="section-heading">Calculated aggregate values</h3>
            ${sqlBlock("SUM EXAMPLE", `SELECT SUM(price * stock) AS inventory_value\nFROM products;`)}

            <div class="book-callout">
              <span class="book-callout-tag">CHECK YOUR ASSUMPTIONS</span>
              AVG and SUM make sense for numeric values. If a column contains text, NULLs, or unexpected units, verify the meaning of the result before using it.
            </div>
          </div>
        `
      },

      // PAGE 14: 11 GROUP BY and HAVING
      {
        pageNumber: 14,
        title: "11 GROUP BY and HAVING",
        content: `
          <div>
            <h2 class="chapter-title"><span class="chapter-num">11</span>GROUP BY and HAVING</h2>
            <p class="book-prose">
              GROUP BY collects rows with the same value into groups, so aggregate functions can calculate a summary for each group. HAVING filters the groups after aggregation.
            </p>

            <h3 class="section-heading">Count students by city</h3>
            ${sqlBlock("GROUP BY", `SELECT city, COUNT(*) AS student_count\nFROM students\nGROUP BY city\nORDER BY student_count DESC;`)}
            <p class="book-prose">
              Each distinct city forms a group. <code>COUNT(*)</code> then counts how many rows belong to that city.
            </p>

            <h3 class="section-heading">WHERE versus HAVING</h3>
            <table class="book-table">
              <thead><tr><th>Clause</th><th>Filters</th><th>When it runs conceptually</th></tr></thead>
              <tbody>
                <tr><td><strong>WHERE</strong></td><td>Individual rows</td><td>Before grouping</td></tr>
                <tr><td><strong>HAVING</strong></td><td>Groups and aggregate results</td><td>After GROUP BY</td></tr>
              </tbody>
            </table>

            ${sqlBlock("FILTER ROWS, THEN GROUPS", `SELECT city, AVG(marks) AS average_marks\nFROM students\nWHERE marks IS NOT NULL\nGROUP BY city\nHAVING AVG(marks) >= 85\nORDER BY average_marks DESC;`)}

            <h3 class="section-heading">Logical query order</h3>
            <p class="book-prose">
              A helpful mental model is: FROM and JOIN choose the source rows; WHERE filters rows; GROUP BY forms groups; HAVING filters groups; SELECT calculates the output; ORDER BY sorts it; LIMIT restricts the final result.
            </p>

            <div class="book-callout">
              <span class="book-callout-tag">RULE OF THUMB</span>
              Use WHERE for row-level conditions such as <code>city = 'Pune'</code>. Use HAVING for group-level conditions such as <code>COUNT(*) &gt; 3</code>.
            </div>

            <h3 class="section-heading">Grouping by multiple columns</h3>
            ${sqlBlock("TWO GROUPING KEYS", `SELECT city, marks, COUNT(*) AS students_at_score\nFROM students\nGROUP BY city, marks\nORDER BY city, marks DESC;`)}
          </div>
        `
      },

      // PAGE 15: 12 Update and delete safely
      {
        pageNumber: 15,
        title: "12 Update and delete safely",
        content: `
          <div>
            <h2 class="chapter-title"><span class="chapter-num">12</span>Update and delete safely</h2>
            <p class="book-prose">
              UPDATE modifies existing rows. DELETE removes rows. Both can affect many records, so inspect the target set before making the change.
            </p>

            <h3 class="section-heading">Update selected rows</h3>
            ${sqlBlock("UPDATE", `UPDATE students\nSET marks = 88\nWHERE student_id = 2;`)}
            <p class="book-prose">
              SET names the column changes. WHERE identifies which rows to change. Without WHERE, every row in the table may be updated.
            </p>

            <h3 class="section-heading">Update more than one column</h3>
            ${sqlBlock("UPDATE", `UPDATE students\nSET city = 'Pune', marks = 89\nWHERE student_id = 2;`)}

            <h3 class="section-heading">Delete selected rows</h3>
            ${sqlBlock("DELETE", `DELETE FROM students\nWHERE student_id = 4;`)}

            <h3 class="section-heading">A safer workflow</h3>
            <ol class="list-decimal pl-4 space-y-0.5 text-[10px] text-slate-700 font-serif mb-2">
              <li>Write a SELECT with the same WHERE condition.</li>
              <li>Check that the selected rows are exactly the intended rows.</li>
              <li>Run UPDATE or DELETE with that condition.</li>
              <li>Run SELECT again to verify the change.</li>
            </ol>

            ${sqlBlock("PREVIEW BEFORE DELETING", `SELECT * FROM students WHERE marks < 40;\n-- After confirming the target rows:\nDELETE FROM students WHERE marks < 40;`)}

            <div class="book-callout warn">
              <span class="book-callout-tag">CAUTION</span>
              A missing WHERE clause is a common cause of accidental mass changes. When possible, practise inside a transaction or use a test copy first.
            </div>
          </div>
        `
      },

      // PAGE 16: 13 Changing table structures
      {
        pageNumber: 16,
        title: "13 Changing table structures",
        content: `
          <div>
            <h2 class="chapter-title"><span class="chapter-num">13</span>Changing table structures</h2>
            <p class="book-prose">
              Table design evolves. ALTER TABLE changes a table definition; TRUNCATE and DROP have different effects and differ in availability between database systems.
            </p>

            <h3 class="section-heading">Add a column</h3>
            ${sqlBlock("SQLITE EXAMPLE", `ALTER TABLE students ADD COLUMN email TEXT;`)}

            <h3 class="section-heading">Rename a column or table</h3>
            ${sqlBlock("SQLITE-SUPPORTED PATTERNS", `ALTER TABLE students RENAME COLUMN full_name TO student_name;\nALTER TABLE students RENAME TO learners;`)}

            <p class="book-prose">
              Support for ALTER TABLE varies by database and version. Some systems also have MODIFY or CHANGE COLUMN operations, while SQLite has a narrower set of direct schema changes.
            </p>

            <h3 class="section-heading">Drop a column or table</h3>
            ${sqlBlock("DESTRUCTIVE OPERATIONS", `ALTER TABLE learners DROP COLUMN email;\nDROP TABLE learners;`)}
            <p class="book-prose">
              DROP TABLE removes both the table definition and its data. Do not use it when you only want to remove rows.
            </p>

            <h3 class="section-heading">DELETE, TRUNCATE, and DROP compared</h3>
            <table class="book-table">
              <thead><tr><th>Command</th><th>Effect</th><th>Typical use</th></tr></thead>
              <tbody>
                <tr><td><code>DELETE FROM t WHERE ...</code></td><td>Removes selected rows; table remains</td><td>Remove records that meet a condition</td></tr>
                <tr><td><code>DELETE FROM t</code></td><td>Removes all rows; table remains</td><td>Clear rows where supported/appropriate</td></tr>
                <tr><td><code>TRUNCATE TABLE t</code></td><td>Empties a table; support varies</td><td>Fast table emptying in systems that support it</td></tr>
                <tr><td><code>DROP TABLE t</code></td><td>Removes table structure and data</td><td>Remove a table that is no longer needed</td></tr>
              </tbody>
            </table>

            <div class="book-callout">
              <span class="book-callout-tag">DIALECT NOTE</span>
              SQLite does not support the TRUNCATE TABLE statement. <code>DELETE FROM table_name</code> removes rows but keeps the table. MySQL supports TRUNCATE TABLE.
            </div>
          </div>
        `
      },

      // PAGE 17: 14 Joins: connect related tables (Part 1)
      {
        pageNumber: 17,
        title: "14 Joins: connect related tables",
        content: `
          <div>
            <h2 class="chapter-title"><span class="chapter-num">14</span>Joins: connect related tables</h2>
            <p class="book-prose">
              A join combines columns from rows in related tables. Joins are most useful when facts are stored separately, as they should be in a well-organised relational design.
            </p>

            <h3 class="section-heading">Sample tables</h3>
            <p class="book-prose">
              Imagine a <code>customers</code> table with one row per customer and an <code>orders</code> table with one row per order. <code>orders.customer_id</code> refers to <code>customers.customer_id</code>.
            </p>
            ${sqlBlock("EXAMPLE DATA SETUP", `CREATE TABLE IF NOT EXISTS customers (\n  customer_id INTEGER PRIMARY KEY,\n  customer_name TEXT NOT NULL\n);\nCREATE TABLE IF NOT EXISTS orders (\n  order_id INTEGER PRIMARY KEY,\n  customer_id INTEGER,\n  product TEXT NOT NULL,\n  FOREIGN KEY (customer_id) REFERENCES customers(customer_id)\n);`)}

            <h3 class="section-heading">INNER JOIN</h3>
            <p class="book-prose">Returns only rows whose join condition matches in both tables.</p>
            ${sqlBlock("INNER JOIN", `SELECT c.customer_name, o.product\nFROM customers AS c\nINNER JOIN orders AS o\n  ON c.customer_id = o.customer_id;`)}

            <h3 class="section-heading">LEFT JOIN</h3>
            <p class="book-prose">
              Returns every row from the left table and matching rows from the right table. If no match exists, the right-table columns are NULL.
            </p>
            ${sqlBlock("LEFT JOIN", `SELECT c.customer_name, o.product\nFROM customers AS c\nLEFT JOIN orders AS o\n  ON c.customer_id = o.customer_id;`)}

            <h3 class="section-heading">RIGHT and FULL joins</h3>
            <p class="book-prose">
              A RIGHT JOIN keeps every row from the right-hand table. FULL OUTER JOIN keeps unmatched rows from both sides. SQLite supports RIGHT and FULL OUTER JOIN in newer versions, while MySQL does not provide a native FULL OUTER JOIN.
            </p>
          </div>
        `
      },

      // PAGE 18: 14 Joins: connect related tables (Part 2)
      {
        pageNumber: 18,
        title: "14 Joins (Continued)",
        content: `
          <div>
            ${sqlBlock("FULL OUTER JOIN PATTERN FOR MYSQL", `SELECT c.customer_name, o.product\nFROM customers AS c\nLEFT JOIN orders AS o\n  ON c.customer_id = o.customer_id\nUNION ALL\nSELECT c.customer_name, o.product\nFROM customers AS c\nRIGHT JOIN orders AS o\n  ON c.customer_id = o.customer_id\nWHERE c.customer_id IS NULL;`)}

            <h3 class="section-heading">CROSS JOIN</h3>
            <p class="book-prose">
              A CROSS JOIN returns every possible pairing between the rows of two tables. Two rows crossed with three rows produce six combinations.
            </p>
            ${sqlBlock("CROSS JOIN", `SELECT s.full_name, c.course_name\nFROM students AS s\nCROSS JOIN courses AS c;`)}

            <h3 class="section-heading">SELF JOIN</h3>
            <p class="book-prose">
              A self join uses one table twice under different aliases. It is useful for relationships such as employees and their managers.
            </p>
            ${sqlBlock("SELF JOIN", `SELECT e.employee_name AS employee,\n       m.employee_name AS manager\nFROM employees AS e\nLEFT JOIN employees AS m\n  ON e.manager_id = m.employee_id;`)}

            <div class="book-callout">
              <span class="book-callout-tag">JOIN DEBUGGING</span>
              If a query returns too many rows, check whether the join key is unique on the side you assumed was one-to-one. A one-to-many relationship naturally produces multiple result rows.
            </div>
          </div>
        `
      },

      // PAGE 19: 15 Set operations (Part 1)
      {
        pageNumber: 19,
        title: "15 Set operations",
        content: `
          <div>
            <h2 class="chapter-title"><span class="chapter-num">15</span>Set operations</h2>
            <p class="book-prose">
              Set operators combine the results of separate SELECT statements vertically. Unlike joins, they do not match rows using a relationship between tables.
            </p>

            <h3 class="section-heading">Rules for set operations</h3>
            <ul class="list-disc pl-4 space-y-0.5 text-[9.8px] text-slate-700 font-serif mb-1.5">
              <li>Each SELECT should return the same number of columns.</li>
              <li>Corresponding columns should have compatible data types.</li>
              <li>The columns must appear in the same order.</li>
              <li>Column names in the final output generally follow the first SELECT.</li>
            </ul>

            <h3 class="section-heading">UNION</h3>
            <p class="book-prose">UNION appends result rows and removes duplicate rows.</p>
            ${sqlBlock("UNION", `SELECT city AS place FROM students WHERE city IS NOT NULL\nUNION\nSELECT city AS place FROM staff\nORDER BY place;`)}

            <h3 class="section-heading">UNION ALL</h3>
            <p class="book-prose">
              UNION ALL appends all rows and keeps duplicates. It is often faster because the database does not need to remove duplicates.
            </p>
            ${sqlBlock("UNION ALL", `SELECT city FROM students WHERE city IS NOT NULL\nUNION ALL\nSELECT city FROM staff;`)}

            <h3 class="section-heading">INTERSECT and EXCEPT</h3>
            <p class="book-prose">
              INTERSECT returns distinct rows common to both query results. EXCEPT returns distinct rows from the first result that do not appear in the second.
            </p>
            ${sqlBlock("SET DIFFERENCES", `SELECT city FROM students\nINTERSECT\nSELECT city FROM staff;`)}
          </div>
        `
      },

      // PAGE 20: 15 Set operations (Part 2)
      {
        pageNumber: 20,
        title: "15 Set operations (Comparison)",
        content: `
          <div>
            <h3 class="section-heading">EXCEPT Example</h3>
            ${sqlBlock("EXCEPT", `SELECT city FROM students WHERE city IS NOT NULL\nEXCEPT\nSELECT city FROM staff;`)}

            <h3 class="section-heading">Set operators versus joins</h3>
            <table class="book-table">
              <thead><tr><th>Question</th><th>Set operation</th><th>Join</th></tr></thead>
              <tbody>
                <tr><td><strong>What combines?</strong></td><td>Rows from compatible result sets</td><td>Columns from related tables</td></tr>
                <tr><td><strong>Need a matching key?</strong></td><td>No</td><td>Usually yes, through ON or USING</td></tr>
                <tr><td><strong>Column counts</strong></td><td>Must match</td><td>Can differ</td></tr>
                <tr><td><strong>Duplicates</strong></td><td>UNION removes duplicates; UNION ALL keeps them</td><td>Depends on row matches and cardinality</td></tr>
              </tbody>
            </table>

            <div class="book-callout mt-3">
              <span class="book-callout-tag">DIALECT NOTE</span>
              MySQL support for set operators depends on server version. If INTERSECT or EXCEPT is unavailable, the task can often be expressed with joins or subqueries.
            </div>
          </div>
        `
      },

      // PAGE 21: 16 Subqueries
      {
        pageNumber: 21,
        title: "16 Subqueries",
        content: `
          <div>
            <h2 class="chapter-title"><span class="chapter-num">16</span>Subqueries</h2>
            <p class="book-prose">
              A subquery is a query nested inside another statement. It lets one query use the result of another query for filtering, comparison, calculation, or building a derived table. For complex queries, test the inner query alone before nesting it.
            </p>

            <h3 class="section-heading">Scalar subquery</h3>
            <p class="book-prose">A scalar subquery returns one value, such as one average or maximum.</p>
            ${sqlBlock("ABOVE-AVERAGE STUDENTS", `SELECT full_name, marks\nFROM students\nWHERE marks > (SELECT AVG(marks) FROM students);`)}

            <h3 class="section-heading">Subquery with IN</h3>
            ${sqlBlock("MATCH A LIST RETURNED BY ANOTHER QUERY", `SELECT full_name, city\nFROM students\nWHERE city IN (\n  SELECT city FROM campuses WHERE active = 1\n);`)}

            <h3 class="section-heading">EXISTS</h3>
            <p class="book-prose">
              EXISTS tests whether the subquery returns at least one row. It is often useful when a related record must exist, without needing columns from that record.
            </p>
            ${sqlBlock("EXISTS PATTERN", `SELECT c.customer_name\nFROM customers AS c\nWHERE EXISTS (\n  SELECT 1\n  FROM orders AS o\n  WHERE o.customer_id = c.customer_id\n);`)}

            <h3 class="section-heading">Subqueries in FROM</h3>
            <p class="book-prose">A subquery in the FROM clause can act as a derived table. Give it an alias in systems that require one.</p>
            ${sqlBlock("DERIVED TABLE", `SELECT city, avg_marks\nFROM (SELECT city, AVG(marks) AS avg_marks\n      FROM students GROUP BY city) AS summary\nWHERE avg_marks >= 80;`)}
          </div>
        `
      },

      // PAGE 22: 17 Views and indexes
      {
        pageNumber: 22,
        title: "17 Views and indexes",
        content: `
          <div>
            <h2 class="chapter-title"><span class="chapter-num">17</span>Views and indexes</h2>
            <p class="book-prose">
              A view stores a query definition and exposes its result like a virtual table. An index is a data structure that can help the database find rows more efficiently.
            </p>

            <h3 class="section-heading">Create a view</h3>
            ${sqlBlock("CREATE VIEW", `CREATE VIEW IF NOT EXISTS high_score_students AS\nSELECT student_id, full_name, marks\nFROM students\nWHERE marks >= 90;`)}
            <p class="book-prose">
              A view normally presents current data from its underlying tables when queried. It is not necessarily a stored copy of the results. Materialized views, where available, behave differently.
            </p>

            <h3 class="section-heading">Use and remove a view</h3>
            ${sqlBlock("QUERY A VIEW", `SELECT *\nFROM high_score_students\nORDER BY marks DESC;`)}

            <h3 class="section-heading">Create an index</h3>
            ${sqlBlock("CREATE INDEX", `CREATE INDEX IF NOT EXISTS idx_students_city\nON students(city);`)}
            <p class="book-prose">
              An index can speed up searches, joins, or ordering that use the indexed column. Indexes take storage and can slow inserts, updates, and deletes because they must be maintained. Do not add indexes blindly; check query patterns and use the database query planner.
            </p>

            <h3 class="section-heading">Remove an index</h3>
            ${sqlBlock("SQLITE EXAMPLE", `DROP INDEX IF EXISTS idx_students_city;`)}

            <div class="book-callout">
              <span class="book-callout-tag">PRACTICAL RULE</span>
              Start with correct, readable SQL. Add indexes when you have a measured reason, especially on columns frequently used for joins and selective filters.
            </div>
          </div>
        `
      },

      // PAGE 23: 18 Transactions and permissions
      {
        pageNumber: 23,
        title: "18 Transactions and permissions",
        content: `
          <div>
            <h2 class="chapter-title"><span class="chapter-num">18</span>Transactions and permissions</h2>
            <p class="book-prose">
              A transaction groups related changes into a unit of work. A transaction can be committed or rolled back, helping prevent partial changes from leaving data inconsistent.
            </p>

            <h3 class="section-heading">The core transaction commands</h3>
            <table class="book-table">
              <thead><tr><th>Command</th><th>Purpose</th></tr></thead>
              <tbody>
                <tr><td><code>BEGIN / START TRANSACTION</code></td><td>Begin a transaction; exact syntax depends on the system</td></tr>
                <tr><td><code>COMMIT</code></td><td>Make the current transaction changes permanent</td></tr>
                <tr><td><code>ROLLBACK</code></td><td>Undo changes since the transaction began or the last savepoint</td></tr>
                <tr><td><code>SAVEPOINT</code></td><td>Create a named point to which part of a transaction can be rolled back</td></tr>
              </tbody>
            </table>

            <h3 class="section-heading">Example: move funds between accounts</h3>
            ${sqlBlock("TRANSACTION PATTERN", `BEGIN;\nUPDATE accounts\nSET balance = balance - 100\nWHERE account_id = 1;\n\nUPDATE accounts\nSET balance = balance + 100\nWHERE account_id = 2;\nCOMMIT;\nSELECT * FROM accounts;`)}
            <p class="book-prose">
              Use <code>ROLLBACK</code> instead if validation fails. A real transfer should also validate that the source account exists, has enough funds, and that both updates affect the intended rows.
            </p>

            <h3 class="section-heading">Savepoints</h3>
            ${sqlBlock("PARTIAL ROLLBACK", `BEGIN;\nUPDATE inventory SET quantity = quantity - 1 WHERE item_id = 7;\nSAVEPOINT after_stock_change;\n-- Other work here\nROLLBACK TO after_stock_change;\nCOMMIT;`)}

            <div class="book-callout warn">
              <span class="book-callout-tag">SAFETY</span>
              Not every statement is transactional in every database, and DDL may trigger special commit behaviour.
            </div>
          </div>
        `
      },

      // PAGE 24: 19 Design habits and debugging
      {
        pageNumber: 24,
        title: "19 Design habits and debugging",
        content: `
          <div>
            <h2 class="chapter-title"><span class="chapter-num">19</span>Design habits and debugging</h2>
            <p class="book-prose">
              Writing SQL well is not just knowing clauses. Good names, clear relationships, and a repeatable debugging process make queries easier to trust. Format queries with consistent indentation, one clause per line, descriptive aliases, and explicit join conditions.
            </p>

            <h3 class="section-heading">Give each table one job</h3>
            <p class="book-prose">
              A <code>students</code> table should describe students; a <code>courses</code> table should describe courses. If a student can take many courses and a course can have many students, model the relationship with a linking table such as <code>enrollments</code>.
            </p>
            ${sqlBlock("MANY-TO-MANY RELATIONSHIP", `CREATE TABLE IF NOT EXISTS enrollments (\n  student_id INTEGER NOT NULL,\n  course_id INTEGER NOT NULL,\n  enrolled_on TEXT,\n  PRIMARY KEY (student_id, course_id),\n  FOREIGN KEY (student_id) REFERENCES students(student_id),\n  FOREIGN KEY (course_id) REFERENCES courses(course_id)\n);`)}

            <h3 class="section-heading">Debug a query systematically</h3>
            <ol class="list-decimal pl-4 space-y-0.5 text-[9.6px] text-slate-700 font-serif mb-1.5">
              <li>Start with the FROM table and run <code>SELECT *</code> with a small LIMIT.</li>
              <li>Add one JOIN at a time and inspect the row count.</li>
              <li>Add WHERE conditions one by one.</li>
              <li>Add calculations and aliases.</li>
              <li>Add GROUP BY and HAVING only after the row-level result is correct.</li>
              <li>Add ORDER BY and LIMIT at the end.</li>
            </ol>

            <h3 class="section-heading">Common mistakes</h3>
            <table class="book-table">
              <thead><tr><th>Problem</th><th>Check</th></tr></thead>
              <tbody>
                <tr><td><strong>No rows returned</strong></td><td>Spelling, exact text, comparison, NULL handling, and input data</td></tr>
                <tr><td><strong>Unexpected duplicates</strong></td><td>Join keys, one-to-many relationships, and SELECT DISTINCT only when appropriate</td></tr>
                <tr><td><strong>Wrong aggregate</strong></td><td>GROUP BY columns, NULLs, and whether a condition belongs in WHERE or HAVING</td></tr>
                <tr><td><strong>UPDATE changed too much</strong></td><td>Preview the WHERE condition with SELECT before changing rows</td></tr>
                <tr><td><strong>Syntax error</strong></td><td>Commas, parentheses, quotes, reserved words, and dialect-specific syntax</td></tr>
              </tbody>
            </table>
          </div>

    /********************************************************************
     * 3. ULTRA-REALISTIC 60FPS 3D PAGE-CURL & SPINE ARCH ENGINE
     ********************************************************************/
    function applySheet3DTransform(sheet, idx, angleDeg) {
      // Normalize progress: 0.0 (right flat) -> 0.5 (vertical mid-turn) -> 1.0 (left flat)
      const t = Math.max(0, Math.min(1, Math.abs(angleDeg) / 180));
      const sinWave = Math.sin(t * Math.PI);       // Peaks at 90deg mid-turn (t = 0.5)
      const doubleWave = Math.sin(t * Math.PI * 2); // Inflects + then - for S-curve paper flex

      // Resting Spine Arch: pages arch gently out of the center gutter even at rest
      const isCoverSheet = (idx === 0 && t < 0.25) || (idx === TOTAL_SHEETS - 1 && t > 0.75);

      // Z-depth layering so stacked pages never z-fight + high Z lift during page turn
      const baseStackZ = (angleDeg <= -90)
        ? (idx - currentSpread) * 0.55
        : (currentSpread - idx) * 0.55;
      const turnLiftZ = sinWave * (isCoverSheet ? 28 : 44);
      const totalZ = baseStackZ + turnLiftZ;

      // Realistic 3D paper flex/curl during turn:
      // As you lift a page from the corner, it pitches slightly in X and twists in Z/skewY
      const curlRotateX = isCoverSheet ? (sinWave * 2.2) : (sinWave * 6.8);
      const curlRotateZ = isCoverSheet ? 0 : (doubleWave * -2.6);
      const curlSkewY   = isCoverSheet ? 0 : (sinWave * -3.2);

      sheet.style.transform = `
        translateZ(${totalZ.toFixed(2)}px)
        rotateY(${angleDeg.toFixed(2)}deg)
        rotateX(${curlRotateX.toFixed(2)}deg)
        rotateZ(${curlRotateZ.toFixed(2)}deg)
        skewY(${curlSkewY.toFixed(2)}deg)
      `;

      // Dynamic Z-index so actively turning sheets always float above resting stacks
      const isMidTurn = t > 0.01 && t < 0.99;
      if (isMidTurn) {
        sheet.style.zIndex = 500 + Math.round(sinWave * 100);
      } else {
        const isFlipped = angleDeg <= -90;
        sheet.style.zIndex = isFlipped ? (idx + 10) : (TOTAL_SHEETS - idx + 10);
      }
      sheet.classList.toggle('flipped', angleDeg <= -90);

      // Moving specular highlight & curl shading on the turning sheet faces
      const frontLighting = sheet.querySelector('.page-front .page-curl-lighting');
      const backLighting = sheet.querySelector('.page-back .page-curl-lighting');

      if (frontLighting && backLighting) {
        if (isMidTurn) {
          const highlightPos = Math.round((1 - t) * 100);
          frontLighting.style.opacity = (sinWave * 0.92).toFixed(2);
          frontLighting.style.background = `linear-gradient(90deg,
            rgba(0,0,0,${(0.32 * sinWave).toFixed(2)}) 0%,
            rgba(255,255,255,${(0.45 * sinWave).toFixed(2)}) ${highlightPos}%,
            rgba(0,0,0,${(0.18 * sinWave).toFixed(2)}) 100%)`;

          backLighting.style.opacity = (sinWave * 0.92).toFixed(2);
          backLighting.style.background = `linear-gradient(270deg,
            rgba(0,0,0,${(0.32 * sinWave).toFixed(2)}) 0%,
            rgba(255,255,255,${(0.45 * sinWave).toFixed(2)}) ${100 - highlightPos}%,
            rgba(0,0,0,${(0.18 * sinWave).toFixed(2)}) 100%)`;
        } else {
          frontLighting.style.opacity = '0';
          backLighting.style.opacity = '0';
        }
      }

      // Sweep a realistic soft cast shadow across the open book underneath
      updateDynamicCastShadow(t, sinWave);
    }

    function updateDynamicCastShadow(t, sinWave) {
      const castEl = document.getElementById('dynamicCastShadow');
      if (!castEl) return;

      if (sinWave < 0.02) {
        castEl.style.opacity = '0';
        return;
      }

      castEl.style.opacity = '1';
      // Shadow center moves from right page (75%) across spine (50%) to left page (25%)
      const shadowCenter = 82 - t * 64;
      const spreadWidth = 14 + sinWave * 22;
      const alpha = (sinWave * 0.42).toFixed(3);

      castEl.style.background = `linear-gradient(90deg,
        transparent ${Math.max(0, shadowCenter - spreadWidth)}%,
        rgba(8, 6, 3, ${alpha}) ${shadowCenter}%,
        transparent ${Math.min(100, shadowCenter + spreadWidth)}%
      )`;
    }

    function renderAllSheets3D() {
      const sheets = document.querySelectorAll('.sheet');
      sheets.forEach((sheet, idx) => {
        applySheet3DTransform(sheet, idx, sheetAngles[idx]);
      });
    }

    function animateSheetToAngle(idx, targetAngle, duration = 760, onComplete) {
      const sheets = document.querySelectorAll('.sheet');
      const sheet = sheets[idx];
      if (!sheet) return;

      if (sheetAnimations[idx]) {
        cancelAnimationFrame(sheetAnimations[idx]);
      }

      const startAngle = sheetAngles[idx];
      const delta = targetAngle - startAngle;
      if (Math.abs(delta) < 0.2) {
        sheetAngles[idx] = targetAngle;
        applySheet3DTransform(sheet, idx, targetAngle);
        if (onComplete) onComplete();
        return;
      }

      const startTime = performance.now();

      // Custom cubic-bezier-like organic paper easing (smooth lift, brisk mid-swing, cushioned landing)
      function easePaperTurn(x) {
        return x < 0.5
          ? 4 * x * x * x
          : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / duration);
        const eased = easePaperTurn(progress);

        sheetAngles[idx] = startAngle + delta * eased;
        applySheet3DTransform(sheet, idx, sheetAngles[idx]);

        if (progress < 1) {
          sheetAnimations[idx] = requestAnimationFrame(step);
        } else {
          sheetAngles[idx] = targetAngle;
          sheetAnimations[idx] = null;
          applySheet3DTransform(sheet, idx, targetAngle);
          triggerBookSettlePulse();
          if (onComplete) onComplete();
        }
      }

      sheetAnimations[idx] = requestAnimationFrame(step);
    }

    // Subtle physical book weight bounce when a heavy page or cover lands
    function triggerBookSettlePulse() {
      const rig = document.getElementById('bookParallaxRig');
      if (!rig) return;
      rig.style.transform = 'translateZ(-4px) rotateX(0.9deg)';
      setTimeout(() => {
        rig.style.transform = 'translateZ(0px) rotateX(0deg)';
      }, 140);
    }

    // Interactive Drag-to-Flip & Click-to-Flip on every sheet
    function attachSheetDragPhysics(sheet, idx) {
      let isPointerDown = false;
      let hasDragged = false;
      let startX = 0;
      let startAngle = 0;

      sheet.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button') || e.target.closest('a') || e.target.closest('tr[onclick]')) return;
        // Only top-most sheet on the right (idx === currentSpread) or left (idx === currentSpread - 1) can be dragged
        if (idx !== currentSpread && idx !== currentSpread - 1) return;

        isPointerDown = true;
        hasDragged = false;
        startX = e.clientX;
        startAngle = sheetAngles[idx];
        sheet.setPointerCapture(e.pointerId);

        if (sheetAnimations[idx]) {
          cancelAnimationFrame(sheetAnimations[idx]);
          sheetAnimations[idx] = null;
        }
      });

      sheet.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 8 && !hasDragged) {
          hasDragged = true;
          playCornerHoverRustle();
        }
        if (!hasDragged) return;

        // Convert horizontal drag distance across book width to 0..-180deg rotation
        const bookPixelWidth = 440;
        const deltaDeg = (dx / bookPixelWidth) * 180;
        const nextAngle = Math.max(-180, Math.min(0, startAngle + deltaDeg));
        sheetAngles[idx] = nextAngle;
        applySheet3DTransform(sheet, idx, nextAngle);
      });

      function finishPointer(e) {
        if (!isPointerDown) return;
        isPointerDown = false;

        if (!hasDragged) {
          // Simple click -> smooth 3D page flip
          if (idx >= currentSpread) {
            goToSpread(idx + 1);
          } else {
            goToSpread(idx);
          }
          return;
        }

        // Drag release: decide whether to complete flip or snap back
        const currentAngle = sheetAngles[idx];
        const turningForward = startAngle > -90;
        const threshold = turningForward ? -55 : -125;

        if (turningForward && currentAngle < threshold) {
          currentSpread = idx + 1;
          playBookAcousticForTransition(idx, idx + 1);
          syncBookFrameAndUI();
          animateSheetToAngle(idx, -180, 460);
        } else if (!turningForward && currentAngle > threshold) {
          currentSpread = idx;
          playBookAcousticForTransition(idx + 1, idx);
          syncBookFrameAndUI();
          animateSheetToAngle(idx, 0, 460);
        } else {
          // Snap back to original resting side
          animateSheetToAngle(idx, startAngle, 380);
        }
      }

      sheet.addEventListener('pointerup', finishPointer);
      sheet.addEventListener('pointercancel', finishPointer);
    }

    function syncBookFrameAndUI() {

      if (currentSpread === 0) {

      } else {
        // Open two-page 3D spread
        bookScene.style.transform = 'translateX(0%) rotateX(8.5deg)';

        const leftRatio = currentSpread / TOTAL_SHEETS;
        const rightRatio = (TOTAL_SHEETS - currentSpread) / TOTAL_SHEETS;
        paperStackLeft.style.opacity = '1';
        paperStackRight.style.opacity = '1';
        paperStackLeft.style.width = `${Math.max(4, Math.round(leftRatio * 17))}px`;
        paperStackRight.style.width = `${Math.max(4, Math.round(rightRatio * 17))}px`;
      }

      // Update UI Counters & Buttons
      const pageIndicator = document.getElementById('pageIndicatorText');
      if (currentSpread === 0) {
        pageIndicator.textContent = 'Front Cover';
      } else if (currentSpread === TOTAL_SHEETS) {
        pageIndicator.textContent = 'Back Cover';
      } else {
        const leftPg = currentSpread * 2 - 1;
        const rightPg = currentSpread * 2;
        pageIndicator.textContent = `${leftPg} - ${Math.min(29, rightPg)} / 29`;
      }

      const spreadSlider = document.getElementById('spreadSlider');
      if (spreadSlider) spreadSlider.value = currentSpread;
      const sidePrevBtn = document.getElementById('sidePrevBtn');
      if (sidePrevBtn) sidePrevBtn.disabled = currentSpread === 0;
      const bottomPrevBtn = document.getElementById('bottomPrevBtn');
      if (bottomPrevBtn) bottomPrevBtn.disabled = currentSpread === 0;
      const sideNextBtn = document.getElementById('sideNextBtn');
      if (sideNextBtn) sideNextBtn.disabled = currentSpread === TOTAL_SHEETS;
      const bottomNextBtn = document.getElementById('bottomNextBtn');
      if (bottomNextBtn) bottomNextBtn.disabled = currentSpread === TOTAL_SHEETS;

      const bookmarkIcon = document.getElementById('bookmarkIcon');
      if (bookmarkIcon) {
        if (bookmarks.has(currentSpread)) {
          bookmarkIcon.setAttribute('fill', '#3b82f6');
          bookmarkIcon.classList.add('text-blue-400');
        } else {
          bookmarkIcon.setAttribute('fill', 'none');
          bookmarkIcon.classList.remove('text-blue-400');
        }
